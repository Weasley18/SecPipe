# Quality checks for SecPipe's own code and policies (the security gate is
# secpipe.yml): unit tests with coverage, lint, types, and a test suite for
# every custom rule and policy.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON: python
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: tests, ruff, mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements/*.txt
      - name: Install (hash-verified)
        run: |
          python -m pip install --require-hashes -r app/requirements.txt -r requirements/secpipe.txt -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: ruff
        run: |
          ruff check app secpipe policy/checkov
          ruff format --check app secpipe policy/checkov
      - name: mypy --strict
        run: mypy
      - name: SecNotes tests (security regression test per fix)
        run: pytest app/tests --cov=secnotes --cov-report=term-missing:skip-covered --cov-report=xml:coverage-app.xml
      - name: SecPipe tests (>= 85% coverage)
        run: pytest secpipe/tests --cov=secpipe --cov-report=term-missing:skip-covered --cov-report=xml:coverage-secpipe.xml --cov-fail-under=85
      - name: policy.yaml schema
        run: secpipe policy validate policy/policy.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage-*.xml
          retention-days: 14

  policies:
    name: custom rules and policies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Semgrep rule tests (# ruleid / # ok annotations)
        run: |
          bin="$(bash -c 'source scripts/ci/lib.sh && python_tools sast')"
          "$bin/semgrep" --test --metrics off policy/semgrep/
      - name: Checkov custom policy tests
        run: ./scripts/ci/checkov-policy-test.sh
      - name: Kyverno policy tests
        run: ./scripts/ci/kyverno-test.sh
      - name: Kustomize overlays render
        run: |
          for o in k8s/overlays/*/; do kubectl kustomize "$o" > /dev/null && echo "ok $o"; done

  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned image, with shellcheck)
        run: |
          image=$(awk 'toupper($1)=="FROM" && $NF=="actionlint" {print $2}' tools/scanners.Dockerfile)
          docker run --rm -v "$PWD:/repo" -w /repo "$image" -color
