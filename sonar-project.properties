# SonarCloud (free for public repositories). Only used when the SONAR_TOKEN
# secret is set; scripts/ci/sonar.sh then exports open issues for the gate.
sonar.organization=weasley18
sonar.projectKey=Weasley18_SecPipe
sonar.projectName=SecPipe
sonar.sources=app/src,secpipe
sonar.exclusions=secpipe/tests/**
sonar.tests=app/tests,secpipe/tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage-app.xml,coverage-secpipe.xml
sonar.sourceEncoding=UTF-8
