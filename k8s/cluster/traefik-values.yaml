# Traefik (Helm chart 41.x) for the local kind cluster: bound to the
# ingress-ready control-plane node through hostPorts, which kind maps to
# 127.0.0.1:8080/8443. ingress-nginx was retired in March 2026, so the
# manifests use a plain Ingress with ingressClassName: traefik.
deployment:
  replicas: 1
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
service:
  spec:
    type: ClusterIP
ports:
  web:
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    hostPort: 443
ingressClass:
  enabled: true
  isDefaultClass: false
providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: false
