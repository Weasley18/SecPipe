# TLS terminates at the ingress controller (Traefik, namespace "ingress"); the
# certificate comes from cert-manager's private CA ClusterIssuer
# (k8s/cluster/cert-manager-issuer.yaml). Locally and in CI alike, kind serves
# it on https://secnotes.localtest.me:8443, and CI's ZAP scan goes through it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secnotes-api
  annotations:
    cert-manager.io/cluster-issuer: secpipe-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [secnotes.localtest.me]
      secretName: secnotes-tls
  rules:
    - host: secnotes.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secnotes-api
                port:
                  name: http
