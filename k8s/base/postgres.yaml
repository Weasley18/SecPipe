# Single-replica Postgres for the demo. Production would use a managed
# database (RDS/Cloud SQL) with backups, TLS and IAM auth; see docs/adr.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
  annotations:
    checkov.io/skip1: CKV_K8S_40=uid 70 is the postgres user of the official alpine image; it is non-root
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres
          imagePullPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: secnotes
            - name: POSTGRES_DB
              value: secnotes
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/secnotes/db_password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi }
            limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 256Mi }
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "secnotes", "-d", "secnotes", "-h", "127.0.0.1"]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "secnotes", "-d", "secnotes", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "secnotes", "-d", "secnotes", "-h", "127.0.0.1"]
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets/secnotes
              readOnly: true
      volumes:
        - name: run
          emptyDir: { sizeLimit: 8Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: secrets
          secret:
            secretName: secnotes-secrets
            defaultMode: 0440
            items:
              - { key: db_password, path: db_password }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
