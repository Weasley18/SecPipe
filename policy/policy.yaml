# SecPipe policy-as-code. The gate (secpipe gate) evaluates every normalised
# finding against this file; scanners are run with all severities enabled so
# this is the ONE place thresholds live. Validated against
# secpipe/aggregator/policy.schema.json on every run and in CI.
# Changes require a CODEOWNERS review (see .github/CODEOWNERS).
version: 1

defaults:
  block_at_or_above: high          # severity that fails the gate
  warn_at_or_above: medium         # severity that is reported as a warning
  always_block_categories: [secret]  # any confirmed secret fails, regardless of severity or age
  block_if_in_kev: true            # CISA Known Exploited Vulnerabilities always block
  epss_bump_threshold: 0.1         # EPSS > 10% bumps severity one level
  no_fix_available: warn           # no upstream fix: warn, do not block, open an Issue
  only_new_findings_block_prs: true  # on PRs, findings already on the base branch only warn
  max_suppressions_per_pr: 3       # more new nosec/nosemgrep/checkov:skip needs a CODEOWNER
  exception_warning_days: 14       # flag exceptions expiring within this many days

branches:
  main:
    block_at_or_above: medium      # stricter on the release branch (applies to PRs into main too)

licences:
  deny: [AGPL-3.0, SSPL-1.0, GPL-3.0, BUSL-1.1]
  allow: [MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, BSD, Apache-2.0, ISC, PSF-2.0, MPL-2.0, LGPL-3.0, LGPL-2.1, Unlicense, 0BSD, Python-2.0]
  unknown: warn

sla_days: { critical: 7, high: 30, medium: 90, low: 180 }

severity_overrides:
  - rule: secnotes-jwt-verification-disabled
    severity: critical
    reason: "Unverified JWTs allow forging any identity, including admin: full account takeover."
  - rule: secnotes-possible-idor
    severity: high
    reason: "Heuristic rule, but a hit means another user's notes may be readable; always review."
  - rule: container-eol-base-image
    severity: high
    reason: "An end-of-life OS never receives fixes; every future CVE in it is permanent."

# Accepted risk. Each entry needs a reason, an owner and an expiry date; an
# expired exception fails the gate and forces a re-review. Match by the
# finding fingerprint (shown in the PR comment and findings.json) or by rule
# (+ optional path glob, + optional tool: only that scanner's findings, and
# "matched no finding" only on runs where that scanner ran).
#
# CPython 3.12 stdlib CVEs from the nightly Grype re-scan of the released SBOM
# (docs/triage-log.md, M19). NVD records fixes only on 3.13+; 3.12.14 is the
# newest 3.12 release and does not carry them. None is reachable in SecNotes.
# Re-review by the expiry: move the runtime to a fixed Python, or renew.
exceptions:
  - rule: CVE-2026-82049
    tool: grype
    path: "python@3.12.*"
    reason: "tarfile extraction filters; SecNotes only writes a tarball (admin export) and never extracts archives."
    owner: "@Weasley18"
    expires: "2026-12-31"
    ticket: "docs/triage-log.md (M19)"
  - rule: CVE-2025-12781
    tool: grype
    path: "python@3.12.*"
    reason: "base64 accepts '+/' despite altchars; only PyJWT decodes base64 here, on HMAC-verified tokens, and revocation and refresh reuse key on jti."
    owner: "@Weasley18"
    expires: "2026-12-31"
    ticket: "docs/triage-log.md (M19)"
  - rule: CVE-2026-3446
    tool: grype
    path: "python@3.12.*"
    reason: "base64 stops at the first padded quad; only PyJWT decodes base64 here, on HMAC-verified tokens, and revocation and refresh reuse key on jti."
    owner: "@Weasley18"
    expires: "2026-12-31"
    ticket: "docs/triage-log.md (M19)"
  - rule: CVE-2026-6019
    tool: grype
    path: "python@3.12.*"
    reason: "http.cookies Morsel.js_output; SecNotes uses bearer tokens and never builds cookies."
    owner: "@Weasley18"
    expires: "2026-12-31"
    ticket: "docs/triage-log.md (M19)"
  - rule: CVE-2026-15806
    tool: grype
    path: "python@3.12.*"
    reason: "urllib.request password managers; unused (previews use httpx, and URLs with credentials are rejected)."
    owner: "@Weasley18"
    expires: "2026-12-31"
    ticket: "docs/triage-log.md (M19)"
  - rule: CVE-2025-15366
    tool: grype
    path: "python@3.12.*"
    reason: "imaplib command injection; imaplib is not used."
    owner: "@Weasley18"
    expires: "2026-12-31"
    ticket: "docs/triage-log.md (M19)"
  - rule: CVE-2025-15367
    tool: grype
    path: "python@3.12.*"
    reason: "poplib command injection; poplib is not used."
    owner: "@Weasley18"
    expires: "2026-12-31"
    ticket: "docs/triage-log.md (M19)"
  - rule: CVE-2026-17084
    tool: grype
    path: "python@3.12.*"
    reason: "stringprep (IDNA 2003 codec); only link-preview hosts reach it, after the exact allow-list check, and resolved addresses are still checked."
    owner: "@Weasley18"
    expires: "2026-12-31"
    ticket: "docs/triage-log.md (M19)"
