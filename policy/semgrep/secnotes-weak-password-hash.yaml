rules:
  - id: secnotes-weak-password-hash
    languages: [python]
    severity: ERROR
    message: >-
      Password hashed with a fast, unsalted digest. MD5/SHA-1/SHA-256 are
      cracked at billions of guesses per second. Use argon2id (argon2-cffi) or
      bcrypt.
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.sha256(...)
          - pattern: hashlib.new("md5", ...)
      - pattern-either:
          - pattern-inside: |
              def $F(..., $PW, ...):
                  ...
          - pattern-inside: |
              def $F(...):
                  ...
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(passw|pwd|hash_pass|verify_pass|credential).*
    metadata:
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
