rules:
  - id: secnotes-jwt-verification-disabled
    languages: [python]
    severity: ERROR
    message: >-
      JWT decoded without signature verification (or without pinning the
      algorithm). Tokens can be forged, e.g. with alg=none or a modified `sub`.
      Pass the key, `algorithms=["HS256"]` and keep verification on.
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)' 
      - pattern: jwt.decode(..., verify=False, ...)
      - pattern: jwt.decode(..., algorithms=[..., "none", ...], ...)
      - patterns:
          - pattern: jwt.decode($TOKEN, $KEY, ...)
          - pattern-not: jwt.decode($TOKEN, $KEY, ..., algorithms=$ALGS, ...)
    metadata:
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      secpipe-severity: critical
      references:
        - https://pyjwt.readthedocs.io/en/stable/api.html#jwt.decode
