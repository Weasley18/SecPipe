rules:
  - id: secnotes-sqlalchemy-raw-sql
    languages: [python]
    severity: ERROR
    message: >-
      SQL text built from a string expression (f-string, concatenation, % or
      .format). User input becomes part of the query: SQL injection. Use
      SQLAlchemy expressions or `text()` with bound `:params`.
    pattern-either:
      - pattern: sqlalchemy.text(f"...")
      - pattern: text(f"...")
      - pattern: text(<... "..." + $X ...>)
      - pattern: text("..." % $X)
      - pattern: text("...".format(...))
      - pattern: $DB.execute(f"...", ...)
      - pattern: $DB.execute(<... "..." + $X ...>, ...)
      - pattern: $DB.execute("..." % $X, ...)
      - pattern: $DB.execute("...".format(...), ...)
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
