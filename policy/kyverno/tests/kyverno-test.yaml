# verify-image-signature needs Rekor and the registry, so it is tested live in
# CI (signed image admitted, unsigned image rejected) instead of here.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: secpipe-admission-policies
policies:
- ../disallow-latest-tag.yaml
- ../require-non-root.yaml
- ../require-limits.yaml
- ../disallow-privileged.yaml
resources:
- resources.yaml
results:
- policy: disallow-latest-tag
  rule: require-image-tag
  resources:
  - good
  - latest-tag
  - pinned-tag
  kind: Pod
  result: pass
- policy: disallow-latest-tag
  rule: require-image-tag
  resources:
  - no-tag
  kind: Pod
  result: fail
- policy: disallow-latest-tag
  rule: disallow-latest
  resources:
  - good
  - no-tag
  - pinned-tag
  kind: Pod
  result: pass
- policy: disallow-latest-tag
  rule: disallow-latest
  resources:
  - latest-tag
  kind: Pod
  result: fail
- policy: require-non-root
  rule: run-as-non-root
  resources:
  - good
  - container-non-root
  - uid-zero
  kind: Pod
  result: pass
- policy: require-non-root
  rule: run-as-non-root
  resources:
  - no-run-as-non-root
  kind: Pod
  result: fail
- policy: require-non-root
  rule: no-uid-zero
  resources:
  - good
  - no-run-as-non-root
  kind: Pod
  result: pass
- policy: require-non-root
  rule: no-uid-zero
  resources:
  - uid-zero
  kind: Pod
  result: fail
- policy: require-limits
  rule: cpu-memory-limits
  resources:
  - good
  - privileged
  kind: Pod
  result: pass
- policy: require-limits
  rule: cpu-memory-limits
  resources:
  - no-limits
  - requests-only
  kind: Pod
  result: fail
- policy: disallow-privileged
  rule: privileged-containers
  resources:
  - good
  - host-network
  kind: Pod
  result: pass
- policy: disallow-privileged
  rule: privileged-containers
  resources:
  - privileged
  - privilege-escalation
  kind: Pod
  result: fail
- policy: disallow-privileged
  rule: host-namespaces
  resources:
  - good
  - privileged
  kind: Pod
  result: pass
- policy: disallow-privileged
  rule: host-namespaces
  resources:
  - host-network
  - host-pid
  kind: Pod
  result: fail
- policy: disallow-privileged
  rule: host-path
  resources:
  - good
  kind: Pod
  result: pass
- policy: disallow-privileged
  rule: host-path
  resources:
  - host-path
  kind: Pod
  result: fail
- policy: disallow-privileged
  rule: privileged-containers
  resources:
  - system-privileged
  kind: Pod
  result: skip
- policy: disallow-privileged
  rule: host-namespaces
  resources:
  - system-privileged
  kind: Pod
  result: skip
- policy: disallow-latest-tag
  rule: autogen-disallow-latest
  resources:
  - secnotes-api-vulnerable
  kind: Deployment
  result: fail
- policy: require-non-root
  rule: autogen-run-as-non-root
  resources:
  - secnotes-api-vulnerable
  kind: Deployment
  result: fail
- policy: require-non-root
  rule: autogen-no-uid-zero
  resources:
  - secnotes-api-vulnerable
  kind: Deployment
  result: fail
- policy: require-limits
  rule: autogen-cpu-memory-limits
  resources:
  - secnotes-api-vulnerable
  kind: Deployment
  result: fail
- policy: disallow-privileged
  rule: autogen-privileged-containers
  resources:
  - secnotes-api-vulnerable
  kind: Deployment
  result: fail
