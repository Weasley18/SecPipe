# Images must be pinned: a tag other than latest, or better a digest.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: SecPipe
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      A missing tag means latest, and latest changes under you, so what was scanned is not what runs. Every container must name a tag other than latest, or a digest.
spec:
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              # Platform namespaces run third-party system pods (CNI, Falco,
              # ingress) that legitimately need host access; they are
              # managed by the cluster admin, not by application teams.
              namespaces: [kube-system, kube-public, kube-node-lease, local-path-storage, tigera-operator, calico-system, calico-apiserver, kyverno, cert-manager, ingress, monitoring]
      validate:
        failureAction: Enforce
        message: "Every image needs an explicit tag or digest (a missing tag means :latest)."
        pattern:
          spec:
            =(ephemeralContainers):
              - image: "*:*"
            =(initContainers):
              - image: "*:*"
            containers:
              - image: "*:*"
    - name: disallow-latest
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              # Platform namespaces run third-party system pods (CNI, Falco,
              # ingress) that legitimately need host access; they are
              # managed by the cluster admin, not by application teams.
              namespaces: [kube-system, kube-public, kube-node-lease, local-path-storage, tigera-operator, calico-system, calico-apiserver, kyverno, cert-manager, ingress, monitoring]
      validate:
        failureAction: Enforce
        message: "The mutable :latest tag is not allowed; pin a version or digest."
        pattern:
          spec:
            =(ephemeralContainers):
              - image: "!*:latest"
            =(initContainers):
              - image: "!*:latest"
            containers:
              - image: "!*:latest"
