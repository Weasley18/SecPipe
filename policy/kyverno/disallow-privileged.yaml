# No privileged containers, privilege escalation, host namespaces or hostPath volumes.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow privileged access
    policies.kyverno.io/category: SecPipe
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      privileged, hostNetwork/hostPID/hostIPC and hostPath each hand a container a path to the node. None of them are needed by application workloads.
spec:
  background: true
  rules:
    - name: privileged-containers
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              # Platform namespaces run third-party system pods (CNI, Falco,
              # ingress) that legitimately need host access; they are
              # managed by the cluster admin, not by application teams.
              namespaces: [kube-system, kube-public, kube-node-lease, local-path-storage, tigera-operator, calico-system, calico-apiserver, kyverno, cert-manager, ingress, monitoring]
      validate:
        failureAction: Enforce
        message: "privileged containers and allowPrivilegeEscalation are not allowed."
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): false
                  =(allowPrivilegeEscalation): false
            =(initContainers):
              - =(securityContext):
                  =(privileged): false
                  =(allowPrivilegeEscalation): false
            containers:
              - =(securityContext):
                  =(privileged): false
                  =(allowPrivilegeEscalation): false
    - name: host-namespaces
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              # Platform namespaces run third-party system pods (CNI, Falco,
              # ingress) that legitimately need host access; they are
              # managed by the cluster admin, not by application teams.
              namespaces: [kube-system, kube-public, kube-node-lease, local-path-storage, tigera-operator, calico-system, calico-apiserver, kyverno, cert-manager, ingress, monitoring]
      validate:
        failureAction: Enforce
        message: "hostNetwork, hostPID and hostIPC are not allowed."
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false
    - name: host-path
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              # Platform namespaces run third-party system pods (CNI, Falco,
              # ingress) that legitimately need host access; they are
              # managed by the cluster admin, not by application teams.
              namespaces: [kube-system, kube-public, kube-node-lease, local-path-storage, tigera-operator, calico-system, calico-apiserver, kyverno, cert-manager, ingress, monitoring]
      validate:
        failureAction: Enforce
        message: "hostPath volumes are not allowed."
        pattern:
          spec:
            =(volumes):
              - X(hostPath): "null"
