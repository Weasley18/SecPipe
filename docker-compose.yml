# Local run of the hardened stack: `make secrets && docker compose up --build`.
# Secrets are files generated by scripts/gen-local-secrets.sh (git-ignored),
# mounted at /run/secrets, never passed as environment variables.
name: secnotes

services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: secnotes
      POSTGRES_DB: secnotes
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secnotes -d secnotes"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: secnotes:local
    environment:
      SECNOTES_ENV: development
      SECNOTES_DB_HOST: db
      SECNOTES_DB_PASSWORD_FILE: /run/secrets/db_password
      SECNOTES_JWT_SECRET_FILE: /run/secrets/jwt_secret
      SECNOTES_CORS_ORIGINS: http://localhost:3000
      SECNOTES_PREVIEW_ALLOWED_HOSTS: example.com,*.wikipedia.org
      SECNOTES_ENABLE_DOCS: "true"
    secrets: [db_password, jwt_secret]
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy

secrets:
  db_password:
    file: ./.secrets/db_password
  jwt_secret:
    file: ./.secrets/jwt_secret

volumes:
  pgdata:
