# Local run of the hardened stack: `make secrets && docker compose up --build`.
# Secrets are files generated by scripts/gen-local-secrets.sh (git-ignored),
# mounted at /run/secrets, never passed as environment variables.
name: secnotes

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: secnotes
      POSTGRES_DB: secnotes
      POSTGRES_PASSWORD: supersecret123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secnotes -d secnotes"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: secnotes:local
    environment:
      SECNOTES_DATABASE_URL: postgresql+psycopg://secnotes:supersecret123@db:5432/secnotes
      SECNOTES_METRICS_PORT: "0"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
